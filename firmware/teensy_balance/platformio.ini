; Jetson Demo Bot — Teensy Balance Controller
; PlatformIO project configuration
; See firmware/FIRMWARE_DESIGN.md for design decisions.
;
; Requires:
;   PlatformIO Core >= 6.0
;   Teensy platform: pio platform install teensy

[env:teensy41]
platform    = teensy
board       = teensy41
framework   = arduino

; -------------------------------------------------------
; Dependencies
; -------------------------------------------------------
; SparkFun BNO08x: supports BNO085 (the IMU on this robot).
; NOTE: Do NOT use Adafruit_BNO055 — that is a different sensor.
;       See FIRMWARE_DESIGN.md §2 for details.
;
; FlexCAN_T4: native Teensy 4.x CAN FD controller driver.
; Used instead of the generic "CAN" library for full Teensy 4.1 support.
lib_deps =
    sparkfun/SparkFun BNO08x Arduino Library @ ^1.0.3
    tonton81/FlexCAN_T4 @ ^1.0.0

; -------------------------------------------------------
; Build settings
; -------------------------------------------------------
build_flags =
    -DCORE_TEENSY
    -DTEENSY41
    -O2                         ; Optimize for speed (balance loop timing)

; -------------------------------------------------------
; Monitor
; -------------------------------------------------------
monitor_speed = 115200
monitor_filters = direct

; -------------------------------------------------------
; Upload
; -------------------------------------------------------
; Teensy uses its own upload tool (Teensy Loader) — no extra config needed.
; If using USB serial for upload: Tools → Port → /dev/ttyACM0 (Linux)
;                                                  COMx          (Windows)
